name: CI & Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build shared game
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      browser_required: ${{ steps.scope.outputs.browser_required }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Include the synthetic PR merge's base, not just its final commit.
          fetch-depth: 2
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Domain, world and save tests
        run: pnpm test
      - name: CI selection and coverage safeguards
        run: pnpm check:ci
      # The game files are not committed (check:ci rejects them): this build is the one every job tests, Pages
      # deploys and the release job publishes.
      - name: Build and package
        env:
          # Recorded in release/release-manifest.json; on main this is the commit the release job publishes.
          BINCOV_BUILD_COMMIT: ${{ github.sha }}
          BINCOV_BUILD_RUN: ${{ github.run_id }}
        run: pnpm package
      # Pages serves the official site at the root and this exact game build at play/ (scripts/site/build.mjs).
      - name: Assemble Pages tree
        run: pnpm site:build
      - name: Record shared artifact checksums
        run: |
          sha256sum dist/index.html 'start the game.html' \
            release/Escape-Bincov-portable.zip release/Escape-Bincov-web.zip \
            release/release-manifest.json pages/index.html pages/play/index.html > build-checksums.sha256
      - name: Select browser regression from validated main history
        id: scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/ci/plan.mjs
      - name: Save CI selection evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ci-selection
          path: test-results/ci-plan.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Upload shared game
        uses: actions/upload-artifact@v6
        with:
          name: built-game
          # Explicit files preserve paths and avoid uploading workspace credentials.
          path: |
            dist/index.html
            start the game.html
            release/Escape-Bincov-portable.zip
            release/Escape-Bincov-web.zip
            release/release-manifest.json
            pages/
            build-checksums.sha256
          if-no-files-found: error
          retention-days: 1

  browser:
    name: Browser / ${{ matrix.group }}
    needs: build
    if: needs.build.outputs.browser_required == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # WebGL on Mesa's lavapipe (Vulkan on the CPU) instead of Chromium's own SwiftShader: several times faster on
      # these GPU-less runners. Chromium blocklists software drivers, so --ignore-gpu-blocklist is required; the
      # --disable-* flags keep 2D canvas, page raster and compositing on the CPU paths they used before (WebGL is
      # read back, as with SwiftShader). Local runs are unaffected.
      BINCOV_CHROME_ARGS: '["--use-angle=vulkan","--ignore-gpu-blocklist","--disable-accelerated-2d-canvas","--disable-gpu-rasterization","--disable-gpu-compositing"]'
      BINCOV_EXPECT_RENDERER: 'Vulkan.*llvmpipe'
    strategy:
      # Independent runners avoid competing Chromium processes and report paths.
      fail-fast: false
      max-parallel: 8
      matrix:
        group: [batch-1, batch-2, batch-3, batch-4, batch-5, batch-6, batch-7, batch-8]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install pinned pnpm
        run: npm install --global pnpm@11.19.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --registry=https://registry.npmjs.org
      - name: Download shared game
        uses: actions/download-artifact@v8
        with:
          name: built-game
          digest-mismatch: error
      - name: Verify shared artifact checksums
        run: sha256sum --check build-checksums.sha256
      # No apt mirror on the critical path: pinned fonts and the runner's lavapipe build come from a cache, or once
      # from bounded, checksummed downloads (scripts/ci/host-packages.sh).
      - name: Choose the host package cache
        id: host-debs
        run: |
          label=$(bash scripts/ci/host-packages.sh cache-label)
          echo "key=ci-host-debs-${{ hashFiles('scripts/ci/fonts-noble.lock', 'scripts/ci/host-packages.sh') }}-$label" >> "$GITHUB_OUTPUT"
      - name: Restore host packages
        id: host-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/ci-host-debs
          key: ${{ steps.host-debs.outputs.key }}
      - name: Download pinned host packages
        if: steps.host-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: bash scripts/ci/host-packages.sh fetch ~/ci-host-debs
      - name: Save host packages
        if: steps.host-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/ci-host-debs
          key: ${{ steps.host-debs.outputs.key }}
      - name: Install Chinese screenshot fonts and the lavapipe driver
        timeout-minutes: 5
        run: bash scripts/ci/host-packages.sh install ~/ci-host-debs
      - name: Install Chromium
        timeout-minutes: 8
        run: pnpm exec playwright install chromium
      - name: Check Chromium starts on the expected WebGL renderer
        timeout-minutes: 15
        run: |
          status=0
          node scripts/ci/check-renderer.mjs || status=$?
          if [ "$status" = 2 ]; then
            echo "::warning::Chromium did not start without Playwright's apt dependencies; installing them"
            pnpm exec playwright install --with-deps chromium
            node scripts/ci/check-renderer.mjs
          elif [ "$status" != 0 ]; then
            exit "$status"
          fi
      - name: Obtain actual pre-expansion client
        if: matrix.group == 'batch-8'
        run: |
          mkdir -p test-results
          curl --fail --location --retry 3 https://raw.githubusercontent.com/xuys2025/escape-bincov/07b1414da9f1ac4c3ad13a23ec914630ccbd7fbb/dist/index.html --output test-results/pre-m0.html
          # The last client before session v5 (perks): test:expansion checks it refuses v5 without overwriting it.
          curl --fail --location --retry 3 https://raw.githubusercontent.com/xuys2025/escape-bincov/44494eaccc45315dc0c5b36b9e66c4e92f463308/dist/index.html --output test-results/pre-perk.html
          # The last client before session v6/v7 (enemy rules): test:expansion checks it refuses v8 without overwriting it.
          curl --fail --location --retry 3 https://raw.githubusercontent.com/xuys2025/escape-bincov/30781f4497203103d7faee707f427f9e0d4f3055/dist/index.html --output test-results/pre-enemy.html
          # The last client before session v8 (gun instances), main 67a7468, which writes v7: it must refuse v8 as well.
          curl --fail --location --retry 3 https://raw.githubusercontent.com/xuys2025/escape-bincov/67a74688eef7e43563e61a2ebf86c26fe03ef8d4/dist/index.html --output test-results/pre-gunsmith.html
      - name: Run browser suites with timing evidence
        env:
          BROWSER_GROUP: ${{ matrix.group }}
        run: node scripts/ci/run-browser.mjs "$BROWSER_GROUP"
      - name: Save suite timing evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-timing-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: test-results/ci-timing/${{ matrix.group }}-attempt-${{ github.run_attempt }}.json
          if-no-files-found: error
          retention-days: 14
      - name: Save diagnostic reports and screenshots
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: browser-evidence-${{ matrix.group }}-attempt-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  verify:
    # Keep this required check and the mirror's release gate stable.
    name: Build and test
    if: always()
    needs: [build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Require build and the selected browser policy to succeed
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          BROWSER_REQUIRED: ${{ needs.build.outputs.browser_required }}
        run: |
          if [[ "$BUILD_RESULT" != success ]]; then
            echo "Build: $BUILD_RESULT"
            exit 1
          fi
          case "$BROWSER_REQUIRED:$BROWSER_RESULT" in
            true:success) echo "Every browser group passed." ;;
            false:skipped) echo "Documentation validated; reused full main browser evidence." ;;
            *) echo "Unexpected browser policy/result: $BROWSER_REQUIRED:$BROWSER_RESULT"; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        if: needs.build.outputs.browser_required == 'true'
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        if: needs.build.outputs.browser_required == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Download all browser timing evidence
        if: needs.build.outputs.browser_required == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: browser-timing-*
          path: test-results/ci-timing
          merge-multiple: true
          digest-mismatch: error
      - name: Require every scheduled suite to have passed
        if: needs.build.outputs.browser_required == 'true'
        run: node scripts/ci/verify-timings.mjs
      - name: Download validated game
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/download-artifact@v8
        with:
          name: built-game
          digest-mismatch: error
      - name: Verify Pages artifact checksums
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: sha256sum --check build-checksums.sha256
      - name: Configure Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: pages

  deploy:
    # Explicit status check (here and in release): the implicit success() also sees the browser groups the docs fast path skips.
    name: Deploy Pages
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy game
        id: deployment
        uses: actions/deploy-pages@v4

  release:
    # README's offline download: the same validated build as Pages, as the rolling main-latest prerelease.
    name: Publish offline release
    if: ${{ !cancelled() && needs.verify.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download validated game
        uses: actions/download-artifact@v8
        with:
          name: built-game
          digest-mismatch: error
      - name: Verify release artifact checksums
        run: sha256sum --check build-checksums.sha256
      - name: Replace the main-latest release files
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-release.sh main-latest
